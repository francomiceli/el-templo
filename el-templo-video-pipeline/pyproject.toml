[project]
name = "el-templo-video-pipeline"
version = "0.1.0"
description = "Exercise video processing pipeline - Greek-themed silhouette styling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mediapipe>=0.10.32",
    "numpy>=2.2.6",
    "opencv-python-headless>=4.13.0.92",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
    "yt-dlp>=2026.2.4",
]

[tool.uv]
package = true

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
