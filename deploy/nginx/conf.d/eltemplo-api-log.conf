# Log de la API con protocolo y tiempos (fase 203, D-13)
# Location: /etc/nginx/conf.d/eltemplo-api-log.conf (contexto http, nginx.conf lo incluye antes de sites-enabled)
#
# El prefijo es idéntico a `combined`: los awk del playbook ($4 fecha, $9 status) siguen andando.
# Los campos nuevos van al final. Nunca loguear headers de auth ni cookies.

log_format api_timed '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'proto=$server_protocol rt=$request_time urt=$upstream_response_time '
                     'uct=$upstream_connect_time host=$host';

# El sondeo de la TV (~350k pedidos/día) no entra en este log.
map $request_uri $api_loggable {
    ~^/api/admin/tv/control/screen  0;
    default                         1;
}
