<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Left ring -->
  <circle cx="5.8" cy="2.5" r="2" stroke="#96593a" stroke-width="1.3" fill="none"/>
  <line x1="5.8" y1="4.5" x2="8" y2="8.5" stroke="#96593a" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Right ring -->
  <circle cx="18.2" cy="2.5" r="2" stroke="#96593a" stroke-width="1.3" fill="none"/>
  <line x1="18.2" y1="4.5" x2="16" y2="8.5" stroke="#96593a" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="12" cy="7.8" r="2.8" fill="#96593a"/>
  <!-- Left arm -->
  <line x1="9.2" y1="11.5" x2="6.5" y2="6.8" stroke="#96593a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="14.8" y1="11.5" x2="17.5" y2="6.8" stroke="#96593a" stroke-width="2" stroke-linecap="round"/>
  <!-- Torso -->
  <rect x="9" y="10.5" width="6" height="8" rx="1.8" fill="#96593a"/>
  <!-- Left leg -->
  <line x1="10.3" y1="18.5" x2="9.3" y2="23.2" stroke="#96593a" stroke-width="2" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="13.7" y1="18.5" x2="14.7" y2="23.2" stroke="#96593a" stroke-width="2" stroke-linecap="round"/>
</svg>
