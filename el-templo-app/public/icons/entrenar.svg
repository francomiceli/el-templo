<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Left ring -->
  <circle cx="5.8" cy="2.5" r="2" stroke="white" stroke-width="1.3" fill="none"/>
  <!-- Right ring -->
  <circle cx="18.2" cy="2.5" r="2" stroke="white" stroke-width="1.3" fill="none"/>
  <!-- Head -->
  <circle cx="12" cy="7.8" r="2.8" fill="white"/>
  <!-- Left arm (ring to torso) -->
  <line x1="5.8" y1="4.5" x2="9.5" y2="11.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right arm (ring to torso) -->
  <line x1="18.2" y1="4.5" x2="14.5" y2="11.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Torso -->
  <rect x="9.5" y="10.5" width="5" height="8" rx="1.6" fill="white"/>
  <!-- Left leg -->
  <line x1="10.5" y1="18.5" x2="9.5" y2="23.2" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="13.5" y1="18.5" x2="14.5" y2="23.2" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
