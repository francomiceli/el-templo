name: CI

# Runs on every push and PR to main branches.
# Validates all 3 projects in parallel: type checks, linting, security audit, and builds.
on:
  push:
    branches: [master, main, develop, staging]
  pull_request:
    branches: [master, main, develop, staging]

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ===========================================
  # API - Type Check, Audit, and Build
  # Validates TypeScript compilation, checks for known CVEs, and produces build output.
  # ===========================================
  api-check:
    name: API - Type Check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-api

    steps:
      # fetch-depth: 0 (historia completa) SOLO en este job, y solo por el step
      # "Tenant lint" de abajo: el gate anti-crecimiento de la allowlist resuelve la
      # rama base con `git merge-base` / `git show <base>:...`. Con el clone shallow
      # que actions/checkout trae por default (fetch-depth: 1) eso NO se puede
      # resolver, y un ratchet que no puede mirar la base es un ratchet decorativo.
      # El lint sale 2 (no 0) cuando no puede resolverla, así que sacar esta línea
      # deja el build rojo en vez de dejarlo pasar en falso.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      # BLOQUEANTE A PROPÓSITO (D-09/D-14): sin `|| true` y sin continue-on-error, al
      # revés que el "Security audit" de acá abajo y que los "Lint" de los frontends.
      # Un acceso nuevo a una tabla gym-owned sin tenant_id ni anotación /* tenant-safe: */
      # deja el build ROJO, y agrandar tenant-lint-allowlist.json también.
      - name: Tenant lint (CON-06)
        run: pnpm lint:tenant --base="$LINT_BASE"
        env:
          # En pull_request, la base del PR (siempre existe). En push, el `before` del
          # evento — que en el PRIMER push de una rama viene con el SHA nulo de 40 ceros
          # y en algunos eventos vacío: el script normaliza los dos casos cayendo a
          # `git merge-base origin/master HEAD`, que necesita la historia de arriba.
          LINT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Security audit  # Advisory only (|| true) — logs CVEs without blocking
        run: pnpm audit --audit-level=high || true

      - name: Build
        run: pnpm run build

  # ===========================================
  # API - Integration Tests
  # Runs Vitest against a real MySQL 8.0 service container.
  # Tests cover auth, sessions, and admin endpoints.
  # ===========================================
  api-test:
    name: API - Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: eltemplo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    defaults:
      run:
        working-directory: el-templo-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test
        env:
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: test
          DB_NAME: eltemplo_test
          DB_PORT: 3306
          NODE_ENV: test
          JWT_SECRET: test-secret-for-ci

  # ===========================================
  # Member App - Lint, Audit, and Build
  # Quasar SPA build with Vite env variables.
  # Lint is advisory (continue-on-error) per user preference.
  # ===========================================
  app-check:
    name: App - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Security audit
        run: pnpm audit --audit-level=high || true

      - name: Build
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000/api' }}
          VITE_APP_NAME: El Templo

  # ===========================================
  # Landing Page (Web) - Lint, Audit, Type Check, and Build
  # Nuxt 3 SSG build. Uses `nuxt generate` for static site generation.
  # ===========================================
  web-check:
    name: Web - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Security audit
        run: pnpm audit --audit-level=high || true

      - name: Type check
        run: pnpm exec nuxi typecheck

      - name: Build (SSG)
        run: pnpm run generate

  # ===========================================
  # Admin App - Lint, Audit, and Build
  # Same structure as member app. Web-only (no Capacitor).
  # ===========================================
  admin-check:
    name: Admin - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint
        continue-on-error: true

      - name: Security audit
        run: pnpm audit --audit-level=high || true

      - name: Build
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000/api' }}
