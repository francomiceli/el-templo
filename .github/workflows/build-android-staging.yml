name: Build Android Staging APK

on:
  workflow_dispatch: # Manual trigger only

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build Staging APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-app/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets for staging
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_VITE_API_URL }}
          VITE_APP_NAME: "El Templo (Staging)"
          VITE_SENTRY_DSN: ${{ secrets.STAGING_VITE_SENTRY_DSN }}

      - name: Install Capacitor dependencies
        working-directory: el-templo-app/src-capacitor
        run: pnpm install --frozen-lockfile

      - name: Sync web assets and native plugins
        working-directory: el-templo-app/src-capacitor
        env:
          STAGING: 'true'
        run: |
          mkdir -p www
          cp -r ../dist/spa/* www/
          npx cap sync android

      - name: Build debug APK
        working-directory: el-templo-app/src-capacitor/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk-${{ github.sha }}
          path: el-templo-app/src-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
