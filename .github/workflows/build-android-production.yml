name: Build Android Production Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (Spanish)'
        required: false
        default: 'Mejoras y correcciones'

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Production Release
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify master branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "ERROR: This workflow must run from master branch. Got: ${{ github.ref }}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-app/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets for production
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_NAME: "El Templo"
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Install Capacitor dependencies
        working-directory: el-templo-app/src-capacitor
        run: pnpm install --frozen-lockfile

      - name: Sync web assets and native plugins
        working-directory: el-templo-app/src-capacitor
        run: |
          mkdir -p www
          cp -r ../dist/spa/* www/
          npx cap sync android

      - name: Decode keystore
        working-directory: el-templo-app/src-capacitor/android/app
        run: printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Decode google-services.json
        working-directory: el-templo-app/src-capacitor/android/app
        run: printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > google-services.json

      - name: Extract version name
        id: version
        run: |
          VERSION_NAME=$(tr -d '[:space:]' < version.txt)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "name=v${VERSION_NAME}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Build signed AAB and APK
        working-directory: el-templo-app/src-capacitor/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleProductionRelease assembleProductionRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-aab-${{ steps.version.outputs.name }}
          path: el-templo-app/src-capacitor/android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-apk-${{ steps.version.outputs.name }}
          path: el-templo-app/src-capacitor/android/app/build/outputs/apk/production/release/app-production-release.apk
          retention-days: 90

      - name: Decode Play Store service account
        run: printf '%s' "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > $RUNNER_TEMP/play-service-account.json
        working-directory: .

      - name: Create release notes
        run: |
          mkdir -p $RUNNER_TEMP/whatsnew
          echo "${{ inputs.release_notes }}" > $RUNNER_TEMP/whatsnew/whatsnew-es-419
        working-directory: .

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: com.eltemplo.app
          releaseFiles: el-templo-app/src-capacitor/android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          track: production
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
