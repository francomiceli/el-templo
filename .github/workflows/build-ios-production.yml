name: Build iOS Production

# Manual trigger only -- macOS runners are expensive (~10x Linux).
#
# PREREQUISITES: See .github/SECRETS.md "iOS Signing (App Store)" section.
# Same secrets as build-ios-staging.yml (both use App Store distribution signing).
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (Spanish)'
        required: false
        default: 'Mejoras y correcciones'

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Upload to App Store Connect
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify master branch
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "ERROR: This workflow must run from master branch. Got: ${{ github.ref }}"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: el-templo-app
        run: pnpm install --frozen-lockfile

      - name: Build web assets for production
        working-directory: el-templo-app
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_NAME: "El Templo"
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Install Capacitor dependencies
        working-directory: el-templo-app/src-capacitor
        run: pnpm install --frozen-lockfile

      - name: Decode GoogleService-Info.plist
        # Mirrors the Android google-services.json pattern. The plist lives in a
        # GitHub secret (base64) so it isn't committed; xcodebuild bundles it
        # via the project.pbxproj reference added in src-capacitor/ios/App/.
        working-directory: el-templo-app/src-capacitor/ios/App/App
        run: printf '%s' "${{ secrets.IOS_GOOGLE_SERVICES_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist

      - name: Sync web assets and native plugins
        working-directory: el-templo-app/src-capacitor
        run: |
          mkdir -p www
          cp -r ../dist/spa/* www/
          npx cap sync ios

      - name: Install CocoaPods
        working-directory: el-templo-app/src-capacitor/ios/App
        run: pod install

      - name: Extract version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < el-templo-app/version.txt)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "name=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "number=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Build: ${{ github.run_number }}, SHA: ${SHORT_SHA}"

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Import provisioning profile
        id: profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          # Extract UUID from provisioning profile and install with UUID filename
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PROFILE_PATH))
          echo "uuid=$PROFILE_UUID" >> $GITHUB_OUTPUT

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

      - name: Build and archive
        working-directory: el-templo-app/src-capacitor/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -destination "generic/platform=iOS" \
            archive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=${{ steps.version.outputs.number }}

      - name: Decode App Store Connect API key
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Create ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>6D9R97DGAK</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.eltemplo.app</key>
              <string>El Templo App Store Distribution</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/app.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Upload IPA as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ipa-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 90
          if-no-files-found: warn

      - name: Submit to App Store review
        working-directory: el-templo-app/src-capacitor/ios
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APP_VERSION: ${{ steps.version.outputs.number }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: fastlane submit

      - name: Tag release
        run: |
          TAG="v${{ steps.version.outputs.number }}-ios"
          git tag "$TAG" || true
          git push origin "$TAG" || true

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
