name: Deploy Staging

# Deploys to staging environment on push to staging branch, or via manual trigger.
# Pipeline: Detect changes → Build only modified projects → Deploy → Smoke test → Auto-rollback on failure.
# Manual triggers (workflow_dispatch) bypass change detection and deploy everything.
on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ===========================================
  # Detect which projects have file changes.
  # Build/deploy steps use these outputs to skip unchanged projects.
  # ===========================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      app: ${{ steps.filter.outputs.app }}
      admin: ${{ steps.filter.outputs.admin }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # fetch-depth: 0 gives paths-filter the previous tip (event.before) so
      # it can compute a real git diff. Default depth=1 leaves event.before
      # unfetchable and paths-filter silently degrades to "no changes",
      # which makes detect-changes return false for every project even when
      # files in those paths actually changed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'el-templo-api/**'
            app:
              - 'el-templo-app/**'
            admin:
              - 'el-templo-admin/**'
            web:
              - 'el-templo-web/**'

  # ===========================================
  # Build API (with tests)
  # Skipped when no API files changed (unless manual trigger).
  # ===========================================
  build-api:
    name: Build API
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: eltemplo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    defaults:
      run:
        working-directory: el-templo-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run API tests
        run: pnpm test
        env:
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: test
          DB_NAME: eltemplo_test
          DB_PORT: 3306
          NODE_ENV: test
          JWT_SECRET: test-secret-for-staging-ci

      - name: Build
        run: pnpm run build

      - name: Copy migration SQL files to dist
        run: cp -r src/db/migrations dist/db/

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: |
            el-templo-api/dist
            el-templo-api/package.json
            el-templo-api/pnpm-lock.yaml
          retention-days: 1

  # ===========================================
  # Build Member App (staging)
  # Skipped when no app files changed (unless manual trigger).
  # ===========================================
  build-app:
    name: Build App
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for staging
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_VITE_API_URL }}
          VITE_APP_NAME: "El Templo (Staging)"
          VITE_SENTRY_DSN: ${{ secrets.STAGING_VITE_SENTRY_DSN }}
          VITE_APP_ENVIRONMENT: staging
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Upload App build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: el-templo-app/dist
          retention-days: 1

  # ===========================================
  # Build Admin App (staging)
  # Skipped when no admin files changed (unless manual trigger).
  # ===========================================
  build-admin:
    name: Build Admin
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for staging
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.STAGING_VITE_SENTRY_DSN }}
          VITE_APP_ENVIRONMENT: staging

      - name: Upload Admin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: el-templo-admin/dist/spa
          retention-days: 1

  # ===========================================
  # Build Landing Page (Web) - SSG (staging)
  # Nuxt 3 static site generation. Output: .output/public/
  # Skipped when no web files changed (unless manual trigger).
  # ===========================================
  build-web:
    name: Build Web
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for staging (SSG)
        run: pnpm run generate
        env:
          NUXT_PUBLIC_API_URL: ${{ secrets.STAGING_VITE_API_URL }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.STAGING_VITE_SENTRY_DSN }}
          NUXT_PUBLIC_APP_ENVIRONMENT: staging

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: el-templo-web/.output/public
          retention-days: 1

  # ===========================================
  # Deploy to Staging Server
  # Runs after builds complete. Only deploys projects that were built.
  # Uses always() because skipped builds (unchanged projects) are OK.
  # Blocked if any build FAILED — at least one must succeed.
  # ===========================================
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-api, build-app, build-admin, build-web]
    if: >-
      always() &&
      !cancelled() &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-app.result == 'success' || needs.build-app.result == 'skipped') &&
      (needs.build-admin.result == 'success' || needs.build-admin.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-api.result == 'success' || needs.build-app.result == 'success' || needs.build-admin.result == 'success' || needs.build-web.result == 'success') &&
      github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download API artifact
        if: needs.build-api.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api-build

      - name: Download App artifact
        if: needs.build-app.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: app-build

      - name: Download Admin artifact
        if: needs.build-admin.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin-build

      - name: Download Web artifact
        if: needs.build-web.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-build

      - name: Install rsync (local)
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Install rsync on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} 'which rsync || sudo apt-get update && sudo apt-get install -y rsync'

      # --- Backup current staging deploy for rollback ---
      - name: Backup current staging deployment
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            if [ -d "${{ secrets.STAGING_API_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.STAGING_API_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.STAGING_API_DEPLOY_PATH }} ${{ secrets.STAGING_API_DEPLOY_PATH }}.previous
            fi
            if [ -d "${{ secrets.STAGING_APP_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.STAGING_APP_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.STAGING_APP_DEPLOY_PATH }} ${{ secrets.STAGING_APP_DEPLOY_PATH }}.previous
            fi
            if [ -d "${{ secrets.STAGING_ADMIN_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.STAGING_ADMIN_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.STAGING_ADMIN_DEPLOY_PATH }} ${{ secrets.STAGING_ADMIN_DEPLOY_PATH }}.previous
            fi
            if [ -d "${{ secrets.STAGING_WEB_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.STAGING_WEB_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.STAGING_WEB_DEPLOY_PATH }} ${{ secrets.STAGING_WEB_DEPLOY_PATH }}.previous
            fi
          ENDSSH

      # .env.production is a Node/Vite convention: "env vars used when NODE_ENV=production".
      # The staging server runs NODE_ENV=production for performance/minification,
      # but APP_ENVIRONMENT=staging tags Sentry errors so they're filterable from production.
      - name: Create .env.production for staging API
        if: needs.build-api.result == 'success'
        run: |
          cat > api-build/.env.production << 'EOF'
          NODE_ENV=production
          PORT=${{ secrets.STAGING_API_PORT }}
          DB_HOST=${{ secrets.STAGING_DB_HOST }}
          DB_PORT=${{ secrets.STAGING_DB_PORT }}
          DB_USER=${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }}
          DB_NAME=${{ secrets.STAGING_DB_NAME }}
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          JWT_EXPIRES_IN=7d
          FRONTEND_URL=${{ secrets.STAGING_FRONTEND_URL }}
          ADMIN_URL=${{ secrets.STAGING_ADMIN_URL }}
          SENTRY_DSN=${{ secrets.STAGING_SENTRY_DSN }}
          APP_ENVIRONMENT=staging
          STAGING_SEED_PASSWORD=${{ secrets.STAGING_SEED_PASSWORD }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
          EOF

      # --- Deploy via rsync (only projects that were built) ---
      - name: Deploy API to staging
        if: needs.build-api.result == 'success'
        run: |
          rsync -avz --delete --exclude node_modules \
            api-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.STAGING_API_DEPLOY_PATH }}

      - name: Deploy App to staging
        if: needs.build-app.result == 'success'
        run: |
          rsync -avz --delete \
            app-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.STAGING_APP_DEPLOY_PATH }}

      - name: Deploy Admin to staging
        if: needs.build-admin.result == 'success'
        run: |
          rsync -avz --delete \
            admin-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.STAGING_ADMIN_DEPLOY_PATH }}

      - name: Deploy Web to staging
        if: needs.build-web.result == 'success'
        run: |
          rsync -avz --delete \
            web-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.STAGING_WEB_DEPLOY_PATH }}

      # --- Post-deploy: deps, migrations, restart (only when API deployed) ---
      - name: Install API dependencies on staging server
        if: needs.build-api.result == 'success'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ${{ secrets.STAGING_API_DEPLOY_PATH }}
            pnpm install --prod --frozen-lockfile
          ENDSSH

      - name: Run database migrations (staging)
        if: needs.build-api.result == 'success'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ${{ secrets.STAGING_API_DEPLOY_PATH }}
            NODE_ENV=production node dist/db/run-migrations.js
          ENDSSH

      - name: Restart staging API
        if: needs.build-api.result == 'success'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ${{ secrets.STAGING_API_DEPLOY_PATH }}
            NODE_ENV=production pm2 restart eltemplo-staging-api --update-env || NODE_ENV=production pm2 start dist/index.js --name eltemplo-staging-api
          ENDSSH

      # --- Smoke test: hit /health, rollback all on failure ---
      - name: Post-deploy smoke test
        id: smoke-test
        run: |
          sleep 10
          API_BASE=$(echo "${{ secrets.STAGING_VITE_API_URL }}" | sed 's|/api$||')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${API_BASE}/health || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Staging health check FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Staging health check PASSED (HTTP $HTTP_CODE)"

      - name: Web staging smoke test
        if: needs.build-web.result == 'success'
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://web-staging.eltemplo.org || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Web staging smoke test FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Web staging smoke test PASSED (HTTP $HTTP_CODE)"

      - name: Rollback staging on failure
        if: failure()
        run: |
          echo "::warning::Rolling back staging deployment..."
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            if [ -d "${{ secrets.STAGING_API_DEPLOY_PATH }}.previous" ]; then
              rm -rf ${{ secrets.STAGING_API_DEPLOY_PATH }}
              mv ${{ secrets.STAGING_API_DEPLOY_PATH }}.previous ${{ secrets.STAGING_API_DEPLOY_PATH }}
            fi
            if [ -d "${{ secrets.STAGING_APP_DEPLOY_PATH }}.previous" ]; then
              rm -rf ${{ secrets.STAGING_APP_DEPLOY_PATH }}
              mv ${{ secrets.STAGING_APP_DEPLOY_PATH }}.previous ${{ secrets.STAGING_APP_DEPLOY_PATH }}
            fi
            if [ -d "${{ secrets.STAGING_ADMIN_DEPLOY_PATH }}.previous" ]; then
              rm -rf ${{ secrets.STAGING_ADMIN_DEPLOY_PATH }}
              mv ${{ secrets.STAGING_ADMIN_DEPLOY_PATH }}.previous ${{ secrets.STAGING_ADMIN_DEPLOY_PATH }}
            fi
            if [ -d "${{ secrets.STAGING_WEB_DEPLOY_PATH }}.previous" ]; then
              rm -rf ${{ secrets.STAGING_WEB_DEPLOY_PATH }}
              mv ${{ secrets.STAGING_WEB_DEPLOY_PATH }}.previous ${{ secrets.STAGING_WEB_DEPLOY_PATH }}
            fi
            cd ${{ secrets.STAGING_API_DEPLOY_PATH }}
            pnpm install --prod --frozen-lockfile
            pm2 restart eltemplo-staging-api --update-env
          ENDSSH
