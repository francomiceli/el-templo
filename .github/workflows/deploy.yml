name: Deploy

# Deploys to production on push to master/main, or via manual trigger.
# Pipeline: Detect changes → Build only modified projects → Deploy → Smoke test → Auto-rollback on failure.
# Manual triggers (workflow_dispatch) bypass change detection and use the `target` input:
#   todo     -> builds and deploys the 4 projects (api, app, admin, web)
#   solo-web -> builds and deploys ONLY the website (eltemplo.org / web-staging), with its own
#               backup and rollback. Used to regenerate the site with current data (sedes,
#               horarios, blog) without touching API, app or admin (fase 195, D-11).
# The web build never blocks the rest of the deploy (D-29): if it fails, API/app/admin still
# ship and the website stays on its previous version (see deploy/ROLLOUT-195.md).
on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      target:
        description: "Qué desplegar ('solo-web' regenera eltemplo.org con los datos actuales: sedes, horarios, blog)"
        type: choice
        options:
          - todo
          - solo-web
        default: todo

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ===========================================
  # Detect which projects have file changes.
  # Build/deploy steps use these outputs to skip unchanged projects.
  # ===========================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.resolve.outputs.api }}
      app: ${{ steps.resolve.outputs.app }}
      admin: ${{ steps.resolve.outputs.admin }}
      web: ${{ steps.resolve.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api:
              - 'el-templo-api/**'
            app:
              - 'el-templo-app/**'
            admin:
              - 'el-templo-admin/**'
            web:
              - 'el-templo-web/**'

      # Central place that decides what gets built/deployed (the build-* jobs only read these outputs).
      #   push                  -> what paths-filter detected
      #   dispatch + todo       -> the 4 projects
      #   dispatch + solo-web   -> only the website
      - name: Resolve what to build
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          FILTER_API: ${{ steps.filter.outputs.api }}
          FILTER_APP: ${{ steps.filter.outputs.app }}
          FILTER_ADMIN: ${{ steps.filter.outputs.admin }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$TARGET" = "solo-web" ]; then
              {
                echo "api=false"
                echo "app=false"
                echo "admin=false"
                echo "web=true"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "api=true"
                echo "app=true"
                echo "admin=true"
                echo "web=true"
              } >> "$GITHUB_OUTPUT"
            fi
          else
            {
              echo "api=${FILTER_API:-false}"
              echo "app=${FILTER_APP:-false}"
              echo "admin=${FILTER_ADMIN:-false}"
              echo "web=${FILTER_WEB:-false}"
            } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # ===========================================
  # Build API (with tests)
  # Skipped when no API files changed (manual trigger: depends on the `target` input).
  # ===========================================
  build-api:
    name: Build API
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: eltemplo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    defaults:
      run:
        working-directory: el-templo-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run API tests
        run: pnpm test
        env:
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: test
          DB_NAME: eltemplo_test
          DB_PORT: 3306
          NODE_ENV: test
          JWT_SECRET: test-secret-for-deploy-ci
          DRY_RUN: "true"

      - name: Build
        run: pnpm run build

      - name: Copy migration SQL files to dist
        run: cp -r src/db/migrations dist/db/

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: |
            el-templo-api/dist
            el-templo-api/package.json
            el-templo-api/pnpm-lock.yaml
          retention-days: 1

  # ===========================================
  # Build Member App
  # Skipped when no app files changed (manual trigger: depends on the `target` input).
  # ===========================================
  build-app:
    name: Build App
    needs: detect-changes
    if: needs.detect-changes.outputs.app == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_NAME: El Templo
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Upload App build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: el-templo-app/dist
          retention-days: 1

  # ===========================================
  # Build Admin App
  # Skipped when no admin files changed (manual trigger: depends on the `target` input).
  # ===========================================
  build-admin:
    name: Build Admin
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Upload Admin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: el-templo-admin/dist/spa
          retention-days: 1

  # ===========================================
  # Build Landing Page (Web) - SSG
  # Nuxt 3 static site generation. Output: .output/public/
  # Skipped when no web files changed (manual trigger: depends on the `target` input).
  # ===========================================
  build-web:
    name: Build Web
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production (SSG)
        run: pnpm run generate
        env:
          NUXT_PUBLIC_API_URL: ${{ secrets.VITE_API_URL }}
          NUXT_PUBLIC_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Medicion (fase 195, D-04): solo en produccion. Sin secret, GA4 y el Pixel no cargan.
          NUXT_PUBLIC_GA4_ID: ${{ secrets.WEB_GA4_ID }}
          NUXT_PUBLIC_META_PIXEL_ID: ${{ secrets.WEB_META_PIXEL_ID }}

      # Fails the build if the site was generated from the dev fixture instead of the real API
      # (and checks robots, llms.txt, sitemap, WhatsApp numbers, etc. against the generated HTML).
      - name: Verify SEO output (datos reales)
        run: node scripts/verify-seo-output.mjs --require-api

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: el-templo-web/.output/public
          retention-days: 1

  # ===========================================
  # Deploy to Server
  # Runs after builds complete. Only deploys projects that were built.
  # Uses always() because skipped builds (unchanged projects) are OK.
  # Blocked if the api/app/admin build FAILED — at least one build must succeed.
  # The web build may fail without blocking (D-29): the site keeps its previous version.
  # ===========================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-api, build-app, build-admin, build-web]
    # build-web is intentionally NOT required to be success/skipped (D-29): a failing web build
    # must not block the API/app/admin deploy.
    if: >-
      always() &&
      !cancelled() &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-app.result == 'success' || needs.build-app.result == 'skipped') &&
      (needs.build-admin.result == 'success' || needs.build-admin.result == 'skipped') &&
      (needs.build-api.result == 'success' || needs.build-app.result == 'success' || needs.build-admin.result == 'success' || needs.build-web.result == 'success') &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Warn if the web build failed
        if: needs.build-web.result == 'failure'
        run: |
          echo "::warning::El build de la web falló: eltemplo.org queda en la versión anterior. Si la API recién incorpora /api/web/site-data, re-disparar con target solo-web cuando esta corrida termine (deploy/ROLLOUT-195.md)."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download API artifact
        if: needs.build-api.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api-build

      - name: Download App artifact
        if: needs.build-app.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: app-build

      - name: Download Admin artifact
        if: needs.build-admin.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin-build

      - name: Download Web artifact
        if: needs.build-web.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-build

      - name: Install rsync (local)
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Install rsync on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} 'which rsync || (sudo apt-get update && sudo apt-get install -y rsync)'

      # --- Backup current deploy for rollback ---
      - name: Backup current deployment
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            BUILD_API="${{ needs.build-api.result }}"
            BUILD_APP="${{ needs.build-app.result }}"
            BUILD_ADMIN="${{ needs.build-admin.result }}"
            BUILD_WEB="${{ needs.build-web.result }}"
            if [ "$BUILD_API" = "success" ] && [ -d "${{ secrets.API_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.API_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.API_DEPLOY_PATH }} ${{ secrets.API_DEPLOY_PATH }}.previous
            fi
            if [ "$BUILD_APP" = "success" ] && [ -d "${{ secrets.APP_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.APP_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.APP_DEPLOY_PATH }} ${{ secrets.APP_DEPLOY_PATH }}.previous
            fi
            if [ "$BUILD_ADMIN" = "success" ] && [ -d "${{ secrets.ADMIN_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.ADMIN_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.ADMIN_DEPLOY_PATH }} ${{ secrets.ADMIN_DEPLOY_PATH }}.previous
            fi
            if [ "$BUILD_WEB" = "success" ] && [ -d "${{ secrets.WEB_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.WEB_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.WEB_DEPLOY_PATH }} ${{ secrets.WEB_DEPLOY_PATH }}.previous
            fi
          ENDSSH

      # Fase 195: Meta (CAPI + gasto) y Google (Search Console + Business Profile) viven SOLO aca.
      # Un secret sin crear llega vacio y la integracion queda apagada (la API lo trata como ausente).
      - name: Create .env.production for API
        if: needs.build-api.result == 'success'
        run: |
          cat > api-build/.env.production << 'EOF'
          NODE_ENV=production
          PORT=${{ secrets.API_PORT || '3000' }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT || '3306' }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '7d' }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          ADMIN_URL=${{ secrets.ADMIN_URL }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}
          FIREBASE_SERVICE_ACCOUNT_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          WELLHUB_API_KEY=${{ secrets.WELLHUB_API_KEY }}
          WELLHUB_WEBHOOK_SECRET=${{ secrets.WELLHUB_WEBHOOK_SECRET }}
          WELLHUB_BASE_URL=${{ secrets.WELLHUB_BASE_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          CAMPAIGN_EMAIL_FROM=${{ secrets.CAMPAIGN_EMAIL_FROM }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_PIXEL_ID=${{ secrets.META_PIXEL_ID }}
          META_CAPI_START_AT=${{ secrets.META_CAPI_START_AT }}
          META_AD_ACCOUNT_IDS=${{ secrets.META_AD_ACCOUNT_IDS }}
          META_GRAPH_VERSION=${{ secrets.META_GRAPH_VERSION }}
          META_CAPI_TEST_EVENT_CODE=${{ secrets.META_CAPI_TEST_EVENT_CODE }}
          GOOGLE_SC_SERVICE_ACCOUNT_BASE64=${{ secrets.GOOGLE_SC_SERVICE_ACCOUNT_BASE64 }}
          GOOGLE_SC_SITE_URL=${{ secrets.GOOGLE_SC_SITE_URL }}
          GBP_SYNC_MODE=${{ secrets.GBP_SYNC_MODE }}
          GBP_OAUTH_CLIENT_ID=${{ secrets.GBP_OAUTH_CLIENT_ID }}
          GBP_OAUTH_CLIENT_SECRET=${{ secrets.GBP_OAUTH_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN=${{ secrets.GBP_REFRESH_TOKEN }}
          EOF

      # --- Deploy via rsync (only projects that were built) ---
      - name: Deploy API to server
        if: needs.build-api.result == 'success'
        run: |
          rsync -avz --delete --exclude node_modules \
            api-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.API_DEPLOY_PATH }}

      - name: Deploy App to server
        if: needs.build-app.result == 'success'
        run: |
          rsync -avz --delete \
            app-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.APP_DEPLOY_PATH }}

      - name: Deploy Admin to server
        if: needs.build-admin.result == 'success'
        run: |
          rsync -avz --delete \
            admin-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.ADMIN_DEPLOY_PATH }}

      - name: Deploy Web to server
        if: needs.build-web.result == 'success'
        run: |
          rsync -avz --delete \
            web-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.WEB_DEPLOY_PATH }}

      # --- Post-deploy: deps, migrations, restart (only when API deployed) ---
      - name: Install API dependencies on server
        if: needs.build-api.result == 'success'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ${{ secrets.API_DEPLOY_PATH }}
            pnpm install --prod --frozen-lockfile
          ENDSSH

      - name: Run database migrations
        if: needs.build-api.result == 'success'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ${{ secrets.API_DEPLOY_PATH }}
            NODE_ENV=production node dist/db/run-migrations.js
          ENDSSH

      - name: Restart API
        if: needs.build-api.result == 'success'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ${{ secrets.API_DEPLOY_PATH }}
            NODE_ENV=production pm2 restart eltemplo-api --update-env || NODE_ENV=production pm2 start dist/index.js --name eltemplo-api
          ENDSSH

      # --- Smoke test: hit /health, rollback all on failure ---
      - name: Post-deploy smoke test
        id: smoke-test
        run: |
          sleep 10
          API_BASE=$(echo "${{ secrets.VITE_API_URL }}" | sed 's|/api$||')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${API_BASE}/health || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Health check PASSED (HTTP $HTTP_CODE)"

          # Fase 176 (T-176-05): /health es categoria `global` y responde 200
          # aunque el seed de flags no haya corrido y los 4 modulos Templo
          # queden apagados -- o sea, con 141 rutas en 404. Este es el unico
          # modo de falla catastrofico de la fase 176 que /health no detecta.
          MODULE_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${API_BASE}/api/blog/posts || echo "000")
          if [ "$MODULE_HTTP_CODE" != "200" ]; then
            echo "::error::Module route check FAILED (HTTP $MODULE_HTTP_CODE)"
            exit 1
          fi
          echo "Module route check PASSED (HTTP $MODULE_HTTP_CODE)"

      - name: Web smoke test
        if: needs.build-web.result == 'success'
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://eltemplo.org || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Web smoke test FAILED (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Web smoke test PASSED (HTTP $HTTP_CODE)"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::warning::Rolling back deployment..."
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            BUILD_API="${{ needs.build-api.result }}"
            BUILD_APP="${{ needs.build-app.result }}"
            BUILD_ADMIN="${{ needs.build-admin.result }}"
            BUILD_WEB="${{ needs.build-web.result }}"
            if [ "$BUILD_API" = "success" ] && [ -d "${{ secrets.API_DEPLOY_PATH }}.previous" ]; then
              rm -rf ${{ secrets.API_DEPLOY_PATH }}
              mv ${{ secrets.API_DEPLOY_PATH }}.previous ${{ secrets.API_DEPLOY_PATH }}
            fi
            if [ "$BUILD_APP" = "success" ] && [ -d "${{ secrets.APP_DEPLOY_PATH }}.previous" ]; then
              rm -rf ${{ secrets.APP_DEPLOY_PATH }}
              mv ${{ secrets.APP_DEPLOY_PATH }}.previous ${{ secrets.APP_DEPLOY_PATH }}
            fi
            if [ "$BUILD_ADMIN" = "success" ] && [ -d "${{ secrets.ADMIN_DEPLOY_PATH }}.previous" ]; then
              rm -rf ${{ secrets.ADMIN_DEPLOY_PATH }}
              mv ${{ secrets.ADMIN_DEPLOY_PATH }}.previous ${{ secrets.ADMIN_DEPLOY_PATH }}
            fi
            if [ "$BUILD_WEB" = "success" ] && [ -d "${{ secrets.WEB_DEPLOY_PATH }}.previous" ]; then
              rm -rf ${{ secrets.WEB_DEPLOY_PATH }}
              mv ${{ secrets.WEB_DEPLOY_PATH }}.previous ${{ secrets.WEB_DEPLOY_PATH }}
            fi
            # Only when the API was deployed in this run (otherwise it was not touched).
            if [ "$BUILD_API" = "success" ]; then
              cd ${{ secrets.API_DEPLOY_PATH }}
              pnpm install --prod --frozen-lockfile
              pm2 restart eltemplo-api --update-env
            fi
          ENDSSH
