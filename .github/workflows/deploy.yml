name: Deploy

# Deploys to production on push to master/main, or via manual trigger.
# Pipeline: Build all 3 apps in parallel → Deploy to EC2 via rsync → Smoke test → Auto-rollback on failure.
on:
  push:
    branches: [master, main]
  workflow_dispatch:  # Allow manual trigger

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================
  # Build API (with tests)
  # Runs integration tests against MySQL before building.
  # Tests act as a deploy gate — failures prevent deployment.
  # ===========================================
  build-api:
    name: Build API
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: eltemplo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    defaults:
      run:
        working-directory: el-templo-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run API tests
        run: pnpm test
        env:
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: test
          DB_NAME: eltemplo_test
          DB_PORT: 3306
          NODE_ENV: test
          JWT_SECRET: test-secret-for-deploy-ci

      - name: Build
        run: pnpm run build

      - name: Copy migration SQL files to dist
        run: cp -r src/db/migrations dist/db/

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: |
            el-templo-api/dist
            el-templo-api/package.json
            el-templo-api/pnpm-lock.yaml
          retention-days: 1

  # ===========================================
  # Build Member App
  # Quasar SPA build. VITE_API_URL from GitHub Secrets points to production API.
  # ===========================================
  build-app:
    name: Build App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_NAME: El Templo

      - name: Upload App build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: el-templo-app/dist
          retention-days: 1

  # ===========================================
  # Build Admin App
  # Web-only Quasar SPA. Artifact uses dist/spa path (flat static files).
  # ===========================================
  build-admin:
    name: Build Admin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: el-templo-admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: el-templo-admin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for production
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Upload Admin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: el-templo-admin/dist/spa
          retention-days: 1

  # ===========================================
  # Deploy to Server
  # Runs only after all 3 builds succeed (needs: [...]).
  # Steps: Download artifacts → Backup current deploy → rsync to EC2 →
  #         Install deps → Run migrations → Restart PM2 → Smoke test.
  # On smoke test failure: atomic rollback of all 3 apps.
  # ===========================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-api, build-app, build-admin]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Download build artifacts from parallel build jobs ---
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-dist
          path: api-build

      - name: Download App artifact
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: app-build

      - name: Download Admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin-build

      - name: Install rsync (local)
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Install rsync on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} 'which rsync || sudo apt-get update && sudo apt-get install -y rsync'

      # --- Backup current deploy (*.previous) for rollback capability ---
      - name: Backup current deployment
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            # Backup API
            if [ -d "${{ secrets.API_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.API_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.API_DEPLOY_PATH }} ${{ secrets.API_DEPLOY_PATH }}.previous
            fi
            # Backup App
            if [ -d "${{ secrets.APP_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.APP_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.APP_DEPLOY_PATH }} ${{ secrets.APP_DEPLOY_PATH }}.previous
            fi
            # Backup Admin
            if [ -d "${{ secrets.ADMIN_DEPLOY_PATH }}" ]; then
              rm -rf ${{ secrets.ADMIN_DEPLOY_PATH }}.previous
              cp -r ${{ secrets.ADMIN_DEPLOY_PATH }} ${{ secrets.ADMIN_DEPLOY_PATH }}.previous
            fi
          ENDSSH

      - name: Create .env.production for API
        run: |
          cat > api-build/.env.production << 'EOF'
          NODE_ENV=production
          PORT=${{ secrets.API_PORT || '3000' }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT || '3306' }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '7d' }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          ADMIN_URL=${{ secrets.ADMIN_URL }}
          EOF

      # --- Deploy all 3 apps via rsync (--delete removes stale files) ---
      - name: Deploy API to server
        run: |
          rsync -avz --delete \
            api-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.API_DEPLOY_PATH }}

      - name: Deploy App to server
        run: |
          rsync -avz --delete \
            app-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.APP_DEPLOY_PATH }}

      - name: Deploy Admin to server
        run: |
          rsync -avz --delete \
            admin-build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.ADMIN_DEPLOY_PATH }}

      # --- Post-deploy: install prod deps, run migrations, restart API ---
      - name: Install dependencies
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ${{ secrets.API_DEPLOY_PATH }}
            pnpm install --prod --frozen-lockfile
          ENDSSH

      - name: Run database migrations
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ${{ secrets.API_DEPLOY_PATH }}
            NODE_ENV=production node dist/db/run-migrations.js
          ENDSSH

      - name: Restart API
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            cd ${{ secrets.API_DEPLOY_PATH }}
            NODE_ENV=production pm2 restart eltemplo-api --update-env || NODE_ENV=production pm2 start dist/index.js --name eltemplo-api
          ENDSSH

      # --- Smoke test: hit /health endpoint, auto-rollback all 3 apps on failure ---
      - name: Post-deploy smoke test
        run: |
          sleep 10
          API_BASE=$(echo "${{ secrets.VITE_API_URL }}" | sed 's|/api$||')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${API_BASE}/health || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check FAILED (HTTP $HTTP_CODE). Rolling back..."
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
              # Restore previous API
              if [ -d "${{ secrets.API_DEPLOY_PATH }}.previous" ]; then
                rm -rf ${{ secrets.API_DEPLOY_PATH }}
                mv ${{ secrets.API_DEPLOY_PATH }}.previous ${{ secrets.API_DEPLOY_PATH }}
              fi
              # Restore previous App
              if [ -d "${{ secrets.APP_DEPLOY_PATH }}.previous" ]; then
                rm -rf ${{ secrets.APP_DEPLOY_PATH }}
                mv ${{ secrets.APP_DEPLOY_PATH }}.previous ${{ secrets.APP_DEPLOY_PATH }}
              fi
              # Restore previous Admin
              if [ -d "${{ secrets.ADMIN_DEPLOY_PATH }}.previous" ]; then
                rm -rf ${{ secrets.ADMIN_DEPLOY_PATH }}
                mv ${{ secrets.ADMIN_DEPLOY_PATH }}.previous ${{ secrets.ADMIN_DEPLOY_PATH }}
              fi
              cd ${{ secrets.API_DEPLOY_PATH }}
              pnpm install --prod --frozen-lockfile
              pm2 restart eltemplo-api --update-env
            ENDSSH
            exit 1
          fi
          echo "Health check PASSED (HTTP $HTTP_CODE)"
